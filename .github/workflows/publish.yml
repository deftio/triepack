name: Release & Publish to npm

# npm matches its trusted publisher on this filename, so it must stay
# publish.yml. PyPI publishes from pypi.yml for the same reason; both call the
# same gate, so the tests that guard a release are defined once.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Version consistency plus the whole cross-language test matrix.
  gate:
    uses: ./.github/workflows/_release-tests.yml

  github-release:
    name: GitHub Release
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  npm:
    name: Publish to npm
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC).
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Trusted publishing needs Node 22.14+ and npm 11.5.1+.
      # package-manager-cache is a v5 input; on v4 it was ignored with a
      # warning, and there is no lockfile here to cache against anyway.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Confirm the toolchain is new enough for trusted publishing
        run: |
          node --version
          npm --version
          npm install -g npm@latest
          npm --version

      - name: Confirm the package version matches the tag
        working-directory: bindings/javascript
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ needs.gate.outputs.version }}" ]; then
            echo "::error::package.json ($PKG_VERSION) does not match the tag (${{ needs.gate.outputs.version }})"
            exit 1
          fi

      - name: Check whether this version is already on npm
        id: published
        working-directory: bindings/javascript
        run: |
          if npm view "triepack@${{ needs.gate.outputs.version }}" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "triepack@${{ needs.gate.outputs.version }} is already published; nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Show what would be published
        if: steps.published.outputs.skip == 'false'
        working-directory: bindings/javascript
        run: npm publish --dry-run

      # Authenticates by OIDC against the trusted publisher configured on
      # npmjs.com, which must name this workflow file exactly (publish.yml).
      # No NPM_TOKEN: if the OIDC exchange fails we want a loud failure, not a
      # silent fall back to a long-lived token. Provenance is attached
      # automatically when publishing this way.
      - name: Publish
        if: steps.published.outputs.skip == 'false'
        working-directory: bindings/javascript
        run: npm publish
