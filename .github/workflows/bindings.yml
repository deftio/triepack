name: Language Binding Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  python:
    name: Python Bindings
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          pip install -e "bindings/python[test]"
          pytest bindings/python/tests

  typescript:
    name: TypeScript Bindings
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and test
        run: |
          cd bindings/typescript
          npm ci
          npx tsc --noEmit
          npm test

  javascript:
    name: JavaScript Bindings
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and test
        run: |
          cd bindings/javascript
          npm ci
          npm test

  go:
    name: Go Bindings
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Test
        run: |
          cd bindings/go
          go test ./...

  swift:
    name: Swift Bindings
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: |
          cd bindings/swift
          swift test

  rust:
    name: Rust Bindings
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: |
          cd bindings/rust
          cargo test

  java:
    name: Java Bindings
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # No Gradle wrapper in this repo, so the action has to
          # install Gradle itself to put `gradle` on PATH.
          gradle-version: "8.10"

      - name: Test
        run: |
          cd bindings/java
          gradle --no-daemon --console=plain test

  kotlin:
    name: Kotlin Bindings
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # No Gradle wrapper in this repo, so the action has to
          # install Gradle itself to put `gradle` on PATH.
          gradle-version: "8.10"

      - name: Test
        run: |
          cd bindings/kotlin
          gradle --no-daemon --console=plain test
