name: CI Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        exclude:
          - os: macos-latest
            compiler: gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC (Ubuntu)
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++

      - name: Install Clang (Ubuntu)
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Set compiler (GCC)
        if: matrix.compiler == 'gcc'
        run: |
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV

      - name: Set compiler (Clang)
        if: matrix.compiler == 'clang'
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      # The terseml grammar tests are Python; without pytest the CMake guard
      # skips them, which would silently drop them from CI.
      - name: Install pytest for the grammar tests
        run: python3 -m pip install --quiet --break-system-packages pytest

      - name: Configure
        run: cmake -B build -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON

      - name: Build (zero warnings required)
        run: cmake --build build 2>&1 | tee build.log

      - name: Verify zero warnings
        run: |
          if grep -iE "warning:" build.log | grep -v "In file included"; then
            echo "::error::Build produced warnings — see above"
            exit 1
          fi

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: AddressSanitizer + UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest

    # The format parses untrusted bytes, and several tests deliberately walk
    # corrupted dictionaries. Those only prove anything when a bad read
    # aborts instead of quietly returning garbage, which is what this job is
    # for. Leak detection is on here; it is unavailable on macOS.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DENABLE_SANITIZERS=ON -DBUILD_TESTS=ON -DBUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build

      # The compaction benchmark loops over a 10k-word corpus; under ASan that
      # is ~9 minutes of measuring sanitizer overhead rather than testing
      # anything. Every other example still runs.
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure -E compaction_benchmark

  version-sync:
    name: Derived files are in sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # triepack-version.txt is the single source of truth; every package
      # manifest, every binding's version() and the docs site derive from it.
      - name: Versions
        run: ./scripts/sync_version.sh --check

      # CHANGELOG.md is the single source of truth for what changed in each
      # version; docs/releases.md is generated from it.
      - name: Changelog
        run: ./scripts/sync_changelog.sh --check

      # What is already published, next to what this tree declares. A pull
      # request is not a release, so a clash is reported rather than fatal —
      # the release itself refuses.
      - name: Published versions
        continue-on-error: true
        run: ./scripts/check_versions.sh

  conformance-fixtures:
    name: Conformance corpus is in sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF

      - name: Regenerate the corpus and its fixtures
        run: |
          python3 tools/gen_conformance_cases.py
          cmake --build build --target fixtures
          python3 tools/gen_malformed_fixtures.py

      # The bindings check themselves against checked-in fixtures, so those
      # files have to be what the generators produce from the current source.
      - name: Nothing changed
        run: |
          if ! git diff --exit-code -- tests/conformance tests/fixtures; then
            echo "::error::tests/conformance is stale — run the generators (see tests/conformance/README.md) and commit the result"
            exit 1
          fi

  terseml:
    name: terseml (C, C++, Python, JavaScript)
    runs-on: ubuntu-latest

    # terseml is a standalone subproject -- it does not link triepack. Three
    # implementations are only worth having if they agree, so all three run
    # against the one generated corpus in the same job.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pytest
        run: python3 -m pip install --quiet --break-system-packages pytest

      - name: C, sanitized C, C++, Python, JavaScript
        run: make -C terseml check

      # vectors.json and vectors.h are generated from terseml.py. If the
      # encoder changes and the corpus does not, the C and JavaScript suites
      # keep testing the old bytes and pass while disagreeing.
      - name: The generated corpus is in sync
        run: |
          make -C terseml vectors
          if ! git diff --exit-code -- terseml/vectors.json terseml/vectors.h; then
            echo "::error::terseml vectors are stale — run 'make -C terseml vectors' and commit the result"
            exit 1
          fi

  lint:
    name: clang-tidy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy

      - name: Configure (with compile_commands.json)
        run: |
          cmake -B build \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF

      - name: Build (needed for generated headers)
        run: cmake --build build

      - name: Run clang-tidy
        run: |
          find src -name '*.c' | xargs clang-tidy -p build --warnings-as-errors='*'

  format-check:
    name: clang-format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      # tests/ is included: it was already conforming, and test code is where
      # formatting drift otherwise goes unnoticed.
      - name: Check formatting
        run: |
          find include src wrapper/src wrapper/include tests \
            -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' | \
            xargs clang-format --dry-run --Werror

  build-32bit:
    name: Ubuntu / GCC / 32-bit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Configure (32-bit)
        run: |
          cmake -B build \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON \
            -DCMAKE_C_FLAGS=-m32 \
            -DCMAKE_CXX_FLAGS=-m32

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
