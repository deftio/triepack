name: Coverage Report

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ lcov

      - name: Configure
        run: |
          cmake -B build \
            -DENABLE_COVERAGE=ON \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage report
        run: |
          cd build
          lcov --capture --directory . --output-file lcov_raw.info \
            --rc branch_coverage=1 \
            --ignore-errors empty,empty,unused,unused
          # The floor is about the library. terseml is a separate subproject
          # with its own suite (its test file lives in terseml/, so */tests/*
          # does not catch it) and tools/ are tools -- including both dropped
          # the measured total from 98.9% to 94.6% and failed the gate on
          # code the gate was never meant to cover.
          lcov --remove lcov_raw.info \
            "*/tests/*" "*/_deps/*" "/usr/*" "*/examples/*" \
            "*/terseml/*" "*/tools/*" \
            --output-file lcov.info \
            --rc branch_coverage=1 \
            --ignore-errors empty,empty,unused,unused
          genhtml lcov.info --output-directory coverage --branch-coverage \
            --ignore-errors inconsistent,category,unmapped

      # A report nobody reads is not a gate. Print the per-file table into the
      # job summary and fail if the totals slip: the suite walks corrupted
      # input on purpose, so a drop here usually means a path stopped being
      # exercised rather than that the code got simpler.
      - name: Report and enforce coverage
        env:
          MIN_LINE_COVERAGE: "97.0"
          MIN_BRANCH_COVERAGE: "80.0"
        run: |
          cd build
          LCOV_FLAGS="--rc branch_coverage=1 --ignore-errors inconsistent,empty,unused"
          lcov --list lcov.info $LCOV_FLAGS | tee coverage.txt

          SUMMARY=$(lcov --summary lcov.info $LCOV_FLAGS 2>&1)
          echo "$SUMMARY"
          LINES=$(echo "$SUMMARY" | awk '/lines\.*:/ {gsub("%","",$2); print $2}')
          BRANCHES=$(echo "$SUMMARY" | awk '/branches\.*:/ {gsub("%","",$2); print $2}')

          # An unparsed total would make every comparison below vacuously
          # true, turning the gate into a no-op. Fail loudly instead.
          if [ -z "$LINES" ] || [ -z "$BRANCHES" ]; then
            echo "::error::Could not parse coverage totals from lcov output"
            exit 1
          fi

          {
            echo "## Coverage"
            echo
            echo "| Metric | Covered | Floor |"
            echo "|--------|---------|-------|"
            echo "| Lines | ${LINES}% | ${MIN_LINE_COVERAGE}% |"
            echo "| Branches | ${BRANCHES}% | ${MIN_BRANCH_COVERAGE}% |"
            echo
            echo '<details><summary>Per-file</summary>'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          awk "BEGIN { exit !($LINES < $MIN_LINE_COVERAGE) }" && {
            echo "::error::Line coverage ${LINES}% is below the ${MIN_LINE_COVERAGE}% floor"
            fail=1
          }
          awk "BEGIN { exit !($BRANCHES < $MIN_BRANCH_COVERAGE) }" && {
            echo "::error::Branch coverage ${BRANCHES}% is below the ${MIN_BRANCH_COVERAGE}% floor"
            fail=1
          }
          exit $fail

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage/

