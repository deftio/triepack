<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌲</text></svg>">
<script defer src="{{ '/assets/tabs.js' | relative_url }}"></script>

<!-- GoatCounter analytics (privacy-friendly, no cookies). -->
<script data-goatcounter="https://deftio.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script>
    // count.js is async, so window.goatcounter does not exist yet. The load
    // event waits for async scripts, which is the earliest safe moment to
    // append the visit-count badge to the <body>.
    window.addEventListener('load', function () {
        if (window.goatcounter && window.goatcounter.visit_count) {
            window.goatcounter.visit_count({append: 'body'});
        }
    });
</script>
